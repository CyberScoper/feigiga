<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Arena Demo</title>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e8eaed;
    --muted: #8a92a1;
    --accent: #7cf;
    --card: #15181d;
    --border: #262a31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: min(640px, 100%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  input, button, textarea {
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    width: 100%;
  }
  button {
    background: var(--accent);
    color: #001018;
    border: 0;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  button:hover { filter: brightness(1.1); }
  .out {
    margin-top: 20px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    white-space: pre-wrap;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    font-size: 13px;
    color: var(--muted);
    min-height: 60px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Vibe Arena Demo</h1>
  <p class="sub">Замени всё в этом файле под задачу. Главное — один happy-path работает.</p>

  <input id="input" placeholder="что-то ввести..." />
  <button id="go">Запустить</button>

  <div class="out" id="out">Здесь будет результат.</div>
</div>

<script>
const $ = (id) => document.getElementById(id);

$("go").addEventListener("click", async () => {
  const value = $("input").value.trim();
  $("out").textContent = "Считаю...";
  try {
    // ЛОКАЛЬНАЯ ЛОГИКА:
    const result = await run(value);
    $("out").textContent = typeof result === "string" ? result : JSON.stringify(result, null, 2);
  } catch (e) {
    $("out").textContent = "Ошибка: " + e.message;
  }
});

async function run(input) {
  // Если нужен бэкенд — раскомментируй:
  // const r = await fetch("http://localhost:8000/api/run", {
  //   method: "POST",
  //   headers: {"Content-Type": "application/json"},
  //   body: JSON.stringify({input})
  // });
  // return await r.json();

  // По умолчанию: чисто фронтовая логика
  return { input, length: input.length, reversed: [...input].reverse().join("") };
}
</script>
</body>
</html>
